name: Build Roku TV Channel

on:
  push:
    branches: [main, master]
    paths:
      - 'roku/**'
      - 'app/src/main/res/**'
      - '.github/workflows/roku-build.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'roku/**'
      - 'app/src/main/res/**'
      - '.github/workflows/roku-build.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package Roku channel
        shell: pwsh
        run: ./roku/build.ps1

      - name: Upload Roku sideload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ppvst-roku-channel
          path: build/roku/ppvst-roku.zip
          if-no-files-found: error
